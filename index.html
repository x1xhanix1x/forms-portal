<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة الاستمارات الذكية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #e94560;
  --primary-dark: #c73a52;
  --secondary: #1a1a2e;
  --accent: #4ecca3;
  --bg: #f5f7fa;
  --card: #ffffff;
  --text: #1a1a2e;
  --text-light: #666;
  --border: #e8ecf1;
  --shadow: 0 4px 20px rgba(0,0,0,0.08);
  --shadow-hover: 0 12px 40px rgba(0,0,0,0.12);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Tajawal', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* Header */
.header {
  background: linear-gradient(135deg, var(--secondary) 0%, #16213e 100%);
  padding: 24px 20px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}
.header-inner {
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
}
.logo-area {
  display: flex;
  align-items: center;
  gap: 14px;
}
.logo-icon {
  width: 48px; height: 48px;
  background: var(--primary);
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px;
}
.logo-text h1 {
  color: white; font-size: 20px; font-weight: 800;
}
.logo-text p {
  color: #8892b0; font-size: 13px; margin-top: 2px;
}
.status-badge {
  background: rgba(78,204,163,0.15);
  color: var(--accent);
  padding: 6px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 700;
  display: flex; align-items: center; gap: 6px;
}

/* Search & Filters */
.controls {
  max-width: 1100px;
  margin: 24px auto;
  padding: 0 20px;
}
.search-box {
  position: relative;
  margin-bottom: 16px;
}
.search-box input {
  width: 100%;
  padding: 16px 52px 16px 20px;
  border: 2px solid var(--border);
  border-radius: 16px;
  font-size: 16px;
  font-family: inherit;
  background: var(--card);
  transition: all 0.3s;
}
.search-box input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(233,69,96,0.1);
}
.search-box .search-icon {
  position: absolute;
  right: 18px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 20px;
  opacity: 0.5;
}
.filter-tabs {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.filter-btn {
  padding: 10px 22px;
  border-radius: 12px;
  border: 2px solid var(--border);
  background: var(--card);
  color: var(--text-light);
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s;
}
.filter-btn:hover {
  border-color: var(--primary);
  color: var(--primary);
}
.filter-btn.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
  box-shadow: 0 4px 15px rgba(233,69,96,0.3);
}

/* Stats Bar */
.stats-bar {
  max-width: 1100px;
  margin: 0 auto 20px;
  padding: 0 20px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
}
.stat-card {
  background: var(--card);
  border-radius: 14px;
  padding: 16px;
  text-align: center;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
}
.stat-card .stat-num {
  font-size: 28px;
  font-weight: 800;
  color: var(--primary);
}
.stat-card .stat-label {
  font-size: 13px;
  color: var(--text-light);
  margin-top: 4px;
}

/* Grid */
.forms-grid {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 20px 40px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 20px;
}

.form-card {
  background: var(--card);
  border-radius: 18px;
  padding: 24px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
  cursor: pointer;
}
.form-card::before {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 5px; height: 100%;
  background: var(--card-color, var(--primary));
  transition: width 0.3s;
}
.form-card:hover {
  transform: translateY(-6px);
  box-shadow: var(--shadow-hover);
}
.form-card:hover::before {
  width: 8px;
}

.card-header {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  margin-bottom: 16px;
}
.card-icon {
  width: 52px; height: 52px;
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px;
  flex-shrink: 0;
  background: var(--card-color-bg, rgba(233,69,96,0.1));
}
.card-info h3 {
  font-size: 16px;
  font-weight: 800;
  color: var(--text);
  line-height: 1.4;
}
.card-info .category-tag {
  display: inline-block;
  margin-top: 6px;
  padding: 3px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
  background: var(--card-color-bg, rgba(233,69,96,0.1));
  color: var(--card-color, var(--primary));
}

.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 4px;
}
.download-count {
  font-size: 13px;
  color: var(--text-light);
  display: flex; align-items: center; gap: 4px;
}
.print-btn {
  padding: 8px 18px;
  border-radius: 10px;
  border: none;
  background: var(--card-color, var(--primary));
  color: white;
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s;
}
.print-btn:hover {
  opacity: 0.9;
  transform: scale(1.05);
}

/* Empty State */
.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
}
.empty-state .empty-icon {
  font-size: 64px;
  margin-bottom: 16px;
  opacity: 0.3;
}
.empty-state h3 {
  font-size: 20px;
  color: var(--text-light);
}

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(8px);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--card);
  border-radius: 24px;
  max-width: 500px;
  width: 100%;
  max-height: 90vh;
  overflow: hidden;
  box-shadow: 0 25px 80px rgba(0,0,0,0.2);
  animation: modalIn 0.3s ease;
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.9) translateY(20px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-header {
  padding: 28px 28px 0;
  text-align: center;
}
.modal-icon {
  width: 72px; height: 72px;
  border-radius: 20px;
  display: flex; align-items: center; justify-content: center;
  font-size: 36px;
  margin: 0 auto 16px;
}
.modal-header h2 {
  font-size: 22px;
  font-weight: 800;
}
.modal-header p {
  color: var(--text-light);
  font-size: 14px;
  margin-top: 6px;
}
.modal-body {
  padding: 24px 28px;
}
.modal-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.modal-btn {
  padding: 14px 20px;
  border-radius: 14px;
  border: none;
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.modal-btn-primary {
  background: var(--primary);
  color: white;
}
.modal-btn-primary:hover { background: var(--primary-dark); }
.modal-btn-secondary {
  background: var(--bg);
  color: var(--text);
}
.modal-btn-secondary:hover { background: var(--border); }
.modal-close {
  padding: 12px;
  text-align: center;
  color: var(--text-light);
  font-size: 14px;
  cursor: pointer;
  border-top: 1px solid var(--border);
}
.modal-close:hover { color: var(--primary); }

/* Footer */
.footer {
  text-align: center;
  padding: 24px;
  color: var(--text-light);
  font-size: 13px;
}

/* Print Styles */
@media print {
  .header, .controls, .stats-bar, .footer, .modal-overlay { display: none !important; }
  .forms-grid { display: block; }
  .form-card { break-inside: avoid; page-break-inside: avoid; }
}

/* Responsive */
@media (max-width: 600px) {
  .header-inner { justify-content: center; text-align: center; }
  .logo-area { flex-direction: column; }
  .forms-grid { grid-template-columns: 1fr; }
  .stat-card .stat-num { font-size: 22px; }
}
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-inner">
    <div class="logo-area">
      <div class="logo-icon">📋</div>
      <div class="logo-text">
        <h1>بوابة الاستمارات الذكية</h1>
        <p>مسح الباركود للوصول السريع إلى جميع المستندات</p>
      </div>
    </div>
    <div class="status-badge">
      <span>🟢</span> النظام متاح
    </div>
  </div>
</header>

<!-- Controls -->
<div class="controls">
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="ابحث عن استمارة أو مستند...">
  </div>
  <div class="filter-tabs">
    <button class="filter-btn active" data-filter="all">الكل</button>
    <button class="filter-btn" data-filter="requests">📨 طلبات</button>
    <button class="filter-btn" data-filter="prints">🖨️ طباعات</button>
    <button class="filter-btn" data-filter="reports">📊 تقارير</button>
  </div>
</div>

<!-- Stats -->
<div class="stats-bar">
  <div class="stat-card">
    <div class="stat-num" id="statTotal">0</div>
    <div class="stat-label">إجمالي المستندات</div>
  </div>
  <div class="stat-card">
    <div class="stat-num" id="statDownloads">0</div>
    <div class="stat-label">إجمالي التحميلات</div>
  </div>
  <div class="stat-card">
    <div class="stat-num" id="statToday">0</div>
    <div class="stat-label">تحميلات اليوم</div>
  </div>
</div>

<!-- Grid -->
<div class="forms-grid" id="formsGrid"></div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-icon" id="modalIcon">📄</div>
      <h2 id="modalTitle">عنوان المستند</h2>
      <p id="modalDesc">اختر الإجراء المناسب</p>
    </div>
    <div class="modal-body">
      <div class="modal-actions">
        <button class="modal-btn modal-btn-primary" id="btnPrint" onclick="handlePrint()">
          🖨️ طباعة المستند
        </button>
        <button class="modal-btn modal-btn-secondary" id="btnDownload" onclick="handleDownload()">
          ⬇️ تحميل PDF
        </button>
        <button class="modal-btn modal-btn-secondary" id="btnPreview" onclick="handlePreview()">
          👁️ معاينة المستند
        </button>
      </div>
    </div>
    <div class="modal-close" onclick="closeModal()">إغلاق</div>
  </div>
</div>

<!-- Footer -->
<footer class="footer">
  نظام إدارة الاستمارات — يعمل بدون إنترنت أو مع الإنترنت
</footer>

<script>
// ==================== البيانات ====================
// ✅ عدّل هنا: أضف/عدّل/احذف الاستمارات حسب حاجتك
const formsData = [
  {
    id: 1,
    name: 'استمارة طلب إجازة',
    category: 'requests',
    icon: '🏖️',
    color: '#4ecca3',
    downloads: 234,
    fileUrl: '#', // ← ضع رابط الملف هنا
    description: 'استمارة رسمية لتقديم طلب إجازة سنوية أو استثنائية'
  },
  {
    id: 2,
    name: 'نموذج طلب سلفة',
    category: 'requests',
    icon: '💰',
    color: '#f9a825',
    downloads: 189,
    fileUrl: '#',
    description: 'نموذج طلب سلفة مالية للموظفين'
  },
  {
    id: 3,
    name: 'استمارة طلب تعويض',
    category: 'requests',
    icon: '📋',
    color: '#e94560',
    downloads: 156,
    fileUrl: '#',
    description: 'استمارة تقديم طلب تعويض عن مصاريف أو أضرار'
  },
  {
    id: 4,
    name: 'شهادة راتب',
    category: 'prints',
    icon: '📄',
    color: '#667eea',
    downloads: 412,
    fileUrl: '#',
    description: 'شهادة رسمية بقيمة الراتب الشهري'
  },
  {
    id: 5,
    name: 'تعريف بالراتب',
    category: 'prints',
    icon: '📃',
    color: '#667eea',
    downloads: 378,
    fileUrl: '#',
    description: 'خطاب تعريف بالراتب للجهات الخارجية'
  },
  {
    id: 6,
    name: 'تقرير أداء شهري',
    category: 'reports',
    icon: '📊',
    color: '#43e97b',
    downloads: 98,
    fileUrl: '#',
    description: 'نموذج تقييم الأداء الوظيفي الشهري'
  },
  {
    id: 7,
    name: 'استمارة طلب نقل',
    category: 'requests',
    icon: '🚚',
    color: '#f5576c',
    downloads: 67,
    fileUrl: '#',
    description: 'استمارة طلب نقل وظيفي أو إداري'
  },
  {
    id: 8,
    name: 'عقد عمل',
    category: 'prints',
    icon: '📝',
    color: '#667eea',
    downloads: 145,
    fileUrl: '#',
    description: 'نسخة من عقد العمل للمراجعين'
  },
  {
    id: 9,
    name: 'تقرير إنجاز سنوي',
    category: 'reports',
    icon: '📈',
    color: '#00b894',
    downloads: 54,
    fileUrl: '#',
    description: 'تقرير ملخص الإنجازات السنوية'
  },
  {
    id: 10,
    name: 'استمارة طلب تدريب',
    category: 'requests',
    icon: '🎓',
    color: '#e17055',
    downloads: 123,
    fileUrl: '#',
    description: 'طلب الالتحاق بدورة تدريبية'
  }
];

const categoryNames = {
  all: 'الكل',
  requests: 'طلبات',
  prints: 'طباعات',
  reports: 'تقارير'
};

// ==================== الحالة ====================
let currentFilter = 'all';
let searchQuery = '';
let selectedForm = null;

// ==================== التخزين المحلي ====================
function getStorage(key, defaultVal) {
  try {
    const val = localStorage.getItem(key);
    return val ? JSON.parse(val) : defaultVal;
  } catch { return defaultVal; }
}
function setStorage(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

// تحميل عدادات من التخزين المحلي
let downloadCounts = getStorage('downloadCounts', {});
let todayDownloads = getStorage('todayDownloads', { date: new Date().toDateString(), count: 0 });

// إعادة تعيين العداد اليومي إذا تغير اليوم
if (todayDownloads.date !== new Date().toDateString()) {
  todayDownloads = { date: new Date().toDateString(), count: 0 };
  setStorage('todayDownloads', todayDownloads);
}

// ==================== العرض ====================
function getFilteredForms() {
  return formsData.filter(form => {
    const matchesCategory = currentFilter === 'all' || form.category === currentFilter;
    const matchesSearch = form.name.includes(searchQuery) || form.description.includes(searchQuery);
    return matchesCategory && matchesSearch;
  });
}

function renderForms() {
  const grid = document.getElementById('formsGrid');
  const filtered = getFilteredForms();

  if (filtered.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🔍</div>
        <h3>لا توجد نتائج مطابقة للبحث</h3>
      </div>
    `;
    updateStats(filtered);
    return;
  }

  grid.innerHTML = filtered.map(form => {
    const count = downloadCounts[form.id] || form.downloads;
    return `
      <div class="form-card" 
           style="--card-color: ${form.color}; --card-color-bg: ${form.color}15;"
           onclick="openModal(${form.id})">
        <div class="card-header">
          <div class="card-icon">${form.icon}</div>
          <div class="card-info">
            <h3>${form.name}</h3>
            <span class="category-tag">${categoryNames[form.category]}</span>
          </div>
        </div>
        <div class="card-footer">
          <span class="download-count">⬇️ ${count.toLocaleString('ar-SA')}</span>
          <button class="print-btn">اطبع الآن</button>
        </div>
      </div>
    `;
  }).join('');

  updateStats(filtered);
}

function updateStats(filtered) {
  const total = formsData.length;
  const totalDownloads = formsData.reduce((sum, f) => sum + (downloadCounts[f.id] || f.downloads), 0);

  document.getElementById('statTotal').textContent = total;
  document.getElementById('statDownloads').textContent = totalDownloads.toLocaleString('ar-SA');
  document.getElementById('statToday').textContent = todayDownloads.count;
}

// ==================== الفلاتر ====================
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderForms();
  });
});

// ==================== البحث ====================
document.getElementById('searchInput').addEventListener('input', (e) => {
  searchQuery = e.target.value.trim();
  renderForms();
});

// ==================== Modal ====================
function openModal(formId) {
  selectedForm = formsData.find(f => f.id === formId);
  if (!selectedForm) return;

  document.getElementById('modalIcon').textContent = selectedForm.icon;
  document.getElementById('modalIcon').style.background = selectedForm.color + '20';
  document.getElementById('modalTitle').textContent = selectedForm.name;
  document.getElementById('modalDesc').textContent = selectedForm.description;

  document.getElementById('modalOverlay').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
  document.body.style.overflow = '';
  selectedForm = null;
}

document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

// ==================== الإجراءات ====================
function recordDownload(formId) {
  downloadCounts[formId] = (downloadCounts[formId] || formsData.find(f => f.id === formId)?.downloads || 0) + 1;
  todayDownloads.count++;
  setStorage('downloadCounts', downloadCounts);
  setStorage('todayDownloads', todayDownloads);
  renderForms();
}

function handlePrint() {
  if (!selectedForm) return;
  recordDownload(selectedForm.id);

  if (selectedForm.fileUrl && selectedForm.fileUrl !== '#') {
    // فتح الملف في نافذة جديدة للطباعة
    const win = window.open(selectedForm.fileUrl, '_blank');
    if (win) {
      win.onload = () => win.print();
    }
  } else {
    alert('ℹ️ رابط الملف غير متوفر حاليًا.\n\nيرجى تعديل البيانات في الكود وإضافة رابط الملف في حقل fileUrl.');
  }
  closeModal();
}

function handleDownload() {
  if (!selectedForm) return;
  recordDownload(selectedForm.id);

  if (selectedForm.fileUrl && selectedForm.fileUrl !== '#') {
    const a = document.createElement('a');
    a.href = selectedForm.fileUrl;
    a.download = selectedForm.name + '.pdf';
    a.click();
  } else {
    alert('ℹ️ رابط الملف غير متوفر حاليًا.\n\nيرجى تعديل البيانات في الكود وإضافة رابط الملف في حقل fileUrl.');
  }
  closeModal();
}

function handlePreview() {
  if (!selectedForm) return;

  if (selectedForm.fileUrl && selectedForm.fileUrl !== '#') {
    window.open(selectedForm.fileUrl, '_blank');
  } else {
    alert('ℹ️ رابط الملف غير متوفر حاليًا.\n\nيرجى تعديل البيانات في الكود وإضافة رابط الملف في حقل fileUrl.');
  }
  closeModal();
}

// ==================== التشغيل ====================
renderForms();
</script>

</body>
</html>
